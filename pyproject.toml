# RL_duck 的唯一环境根。
#
# 这个仓故意与 handbook 那九讲的环境分开：小鸭子的训练环境钉 mjlab 1.3.0 + torch 2.9.1，
# 九讲那套钉 mjlab >=1.4,<1.5 + torch 2.8.0，装不进同一个环境。独立仓 + 独立环境让这件事
# 变成非问题，也不用去动已经验证过的九讲。
#
# 装法（在本目录）：
#   uv sync
# 跑法：
#   uv run python code/train_v1_reinforce.py
[project]
name = "rl-duck"
version = "0.1.0"
description = "小鸭子强化学习入门：REINFORCE → A2C → PPO，一套算法换几个动作"
# <3.13：上游 microduck_rl 经 bam 钉了 requires-python <3.13，跟着它走。
requires-python = ">=3.12, <3.13"
dependencies = [
    # 环境的全部来源：机器人模型、任务配置、BAM 执行器、域随机化。
    # 我们只消费它注册的那些任务，训练器是自己的（见 code/）。
    "mjlab-microduck",
    # 我们的训练器：Dataset -> DataModule -> LightningModule -> trainer.fit
    "lightning",
    "wandb",
    "matplotlib",
    "numpy",
    # rollout 录像与关键帧序列（与 handbook 的 rollout.py 用同一个库，代码才好逐字复用）
    "mediapy",
    # 镜像增广函数按 TensorDict 收发观测组，所以 train_v3 直接 import 它。
    # 它同时也是 mjlab 的传递依赖 —— 但传递依赖不是声明：mjlab 哪天不再需要它，
    # `uv sync` 依旧成功，而 `from tensordict import TensorDict` 会 ModuleNotFoundError，
    # 且只在跑前滚翻（唯一开镜像损失的任务）时才炸，别的任务全过。
    "tensordict",
]

[dependency-groups]
# `uv sync` 默认会装 dev 组，所以冒烟测试开箱就能跑（不用 `uv run --with pytest`）。
# ruff 也进 dev：判据要跟着仓库走，不能靠敲命令的人记得 `--with ruff`。
dev = ["pytest", "ruff"]

# ─────────────────────────────────────────────────────────────────────────────
# ruff —— 判据从主仓 experiment_main_v1/pyproject.toml 的 canonical 配置搬过来。
#
# 为什么非配不可：没有 `[tool.ruff]` 时 `ruff check` 只跑默认那四组（E4/E7/E9/F），
# 于是"全绿"这句话字面上不成立 —— 它绿的是一份**没人选定**的判据。
# 实测：换上 canonical 之后立刻多出 7 条 ARG002，其中一条不是风格问题
# （`on_before_optimizer_step` 丢掉 Lightning 传进来的 optimizer，见那个函数的注释）。
# 一份会被学员照抄工程规矩的材料，判据不能是"默认值"。
#
# 与主仓的唯一差异是 `target-version`：本仓 `requires-python` 钉 >=3.12,<3.13
# （上游 microduck_rl 经 bam 钉的），所以写 py312 而不是主仓的 py311。
# 这不是口径分歧，是本仓解释器版本的事实。主仓那条 `extend-exclude = ["vendored"]`
# 也没搬 —— 本仓没有 vendored/，留着就是给一条不存在的路径配规则。
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle 错误
  "F",      # pyflakes：未定义的名字、未用的 import
  "I",      # isort：import 顺序确定化
  "B",      # bugbear：可变默认参数等真 bug
  "UP",     # pyupgrade
  "C4",     # 推导式
  "SIM",    # 可简化的写法
  "S110",   # try-except-pass      ← 静默吞异常
  "S112",   # try-except-continue  ← 同上
  "BLE",    # 捕获过宽的异常
  "ARG",    # 未使用的参数（常是接口没对齐的信号）
  "PT",     # pytest 风格
  "RUF100", # 过期的 `# noqa`（挂着却已无对应告警 = 注释在说谎）
]
ignore = ["E501"]   # 行长交给 formatter，不在 lint 里报

[tool.ruff.lint.per-file-ignores]
# 测试里允许 assert；也允许重复 —— DAMP 优先于 DRY。
"**/tests/**" = ["S101", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
package = false
# 这三条抄自上游 microduck_rl 的 pyproject —— uv 只认「工作区根」的 override 与 source，
# 上游作为依赖时它自己那份被忽略，所以必须在这里重述一遍，否则 uv sync 直接解析失败。
override-dependencies = [
    # bam 钉 protobuf<4.0（给它的 zmq/dynamixel 消息用，我们不用），
    # 不放开会连锁把 onnx 压到 1.17.0 —— 那个版本没有 wheel，要从源码编。
    "protobuf>=4.0,<7.0",
    "onnx>=1.20.1",
    # bam 依赖 PyPI 上的占位包 zmq==0.0.0，它的 wheel 是坏的（缺 .dist-info），
    # 干净环境上 uv sync 会直接失败。我们只用 bam.mjlab，用一个永假的 marker 把它丢掉。
    "zmq ; python_version < '3.0'",
    # BAM 执行器模型钉到上游 uv.lock 里那个实测可用的 commit。
    #
    # 为什么走 override 而不是 [tool.uv.sources]，两条路都试过：
    #   · 只写 sources → **静默无效**。BAM 是 mjlab-microduck 的传递依赖，
    #     而 uv 的 sources 只作用于 [project.dependencies] 里的直接依赖。
    #   · 再把它列成直接依赖 → uv 报**冲突**：mjlab-microduck 要 @mjlab_frictionloss（分支），
    #     我们要 @62bd8ce（提交），uv 把「分支」和「提交」当成两个不同的来源。
    # override 是唯一能替所有需求方一次定死的地方。
    #
    # 为什么非钉不可：分支最新的 57d13ea 那一版，cfg 基类没有 vin_drop_gain_range，
    # 而 microduck@5946fd9 会往里传 —— 表现是 uv sync 成功、320 个包装齐，
    # 一 import 就 TypeError。装得下来、跑不起来，是这类问题最费时间的形态。
    "better-actuator-models @ git+https://github.com/Rhoban/bam.git@62bd8ce12154340be97e06f7f41a0ca8f116d967",
]

[tool.uv.sources]
# 钉具体 commit，不用 branch —— 上游在动，branch 会让「同一份代码」在不同时间装出不同东西。
mjlab-microduck = { git = "https://github.com/pollen-robotics/microduck_rl", rev = "5946fd9cdbc58956424420153e51975af3b30d77" }
# BAM 执行器模型（分发名 better-actuator-models，import 名 bam）不在这里 ——
# 它是传递依赖，sources 对它无效，只能走上面的 override-dependencies。
